name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check POSIX launcher
        if: runner.os != 'Windows'
        run: bash ./start_macos_linux.command --help
      - name: Check Windows launcher aliases
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call start_windows.bat --help || exit /b 1
          call Start_LapAnalyzer_MIN.bat --help || exit /b 1

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history
        shell: bash
        run: |
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          scratch="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" \
            --output "$scratch/$archive"
          (
            cd "$scratch"
            printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
            tar -xzf "$archive" gitleaks
          )
          "$scratch/gitleaks" git --redact=100 --no-banner --log-opts='--all --full-history' .
